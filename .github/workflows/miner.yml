name: FishMya Auto Bot

on:
  schedule:
    - cron: '0 */6 * * *'   # ၆ နာရီတစ်ခါ run
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # job တစ်ခု 5 နာရီ 50 မိနစ် run
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: python fishmya_bot.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        GAME_ACCESS_TOKEN: ${{ secrets.GAME_ACCESS_TOKEN }}

        
